# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # hatch-vcs derives the version from git tags, which shallow clones lack
    post_checkout:
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/source/conf.py

# Installing the package pulls in its dependencies, which autodoc needs to
# import the modules. No data is downloaded during the build.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
