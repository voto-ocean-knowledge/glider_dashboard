# Conda environment with the dependencies of glider-dashboard (see pyproject.toml).
# After creating it, install the package itself with `pip install --no-deps -e .`
name: glider_dashboard
channels:
  - conda-forge
dependencies:
  - cmocean
  - datashader
  - erddapy
  - gsw
  - holoviews
  - netcdf4
  - numpy
  - pandas
  - panel
  - param>=2
  - plotly
  - polars
  - pyarrow
  - pyyaml
  - urllib3>=2
  - xarray
  - pytest
  - hatchling
  - hatch-vcs
