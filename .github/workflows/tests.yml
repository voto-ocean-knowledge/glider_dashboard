name: Tests

# no permissions by default
permissions: {}

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: [ "3.11", "3.14" ]
        os: [ windows-latest, ubuntu-latest, macos-latest ]
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Micromamba ${{ matrix.python-version }}
      uses: mamba-org/setup-micromamba@d6abac32e3a0d16ca7161790b7c20e0167cfdae8  # v3.2.0
      with:
        environment-name: glider_dashboard
        init-shell: bash
        create-args: >-
          python=${{ matrix.python-version }} pip python-gil
          --file environment.yml
          --channel conda-forge

    - name: Install package
      run: python -m pip install --no-deps -e .

    - name: Tests
      run: python -m pytest --cov --cov-report=lcov

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
      with:
        github-token: ${{ github.token }}
        file: coverage.lcov
        format: lcov
        flag-name: ${{ matrix.os }}-py${{ matrix.python-version }}
        parallel: true

  coveralls-finish:
    # combine the parallel coverage uploads of the matrix jobs into one report
    needs: [run]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Finish Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
      with:
        github-token: ${{ github.token }}
        parallel-finished: true
