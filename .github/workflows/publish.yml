# Build the sdist and wheel, and publish them to PyPI as `glider-dashboard`
# when a GitHub release is published.
#
# Uses PyPI trusted publishing, no API token is stored in GitHub. One-time
# setup on https://pypi.org/manage/account/publishing/ : add a (pending)
# publisher with project name `glider-dashboard`, this repository, workflow
# `publish.yml` and environment `pypi`.

name: Publish to PyPI

on:
  workflow_dispatch:  # build only, to check the packages
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # hatch-vcs derives the version from the release tag
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v2

  publish:
    name: Publish to PyPI
    needs: [dist]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glider-dashboard
    permissions:
      id-token: write  # trusted publishing
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Packages
          path: dist
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - uses: pypa/gh-action-pypi-publish@release/v1
